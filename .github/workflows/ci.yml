name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      - feature/**
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build project
        run: npm run build

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend
